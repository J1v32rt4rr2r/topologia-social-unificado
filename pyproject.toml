[project]
name = "topologia-social"
version = "0.2.0"
description = "Sistema multi-agente para observación topológica de la cultura"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",

    "openai>=1.0",
    "feedparser>=6.0",
    "duckduckgo-search>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.scripts]
topologia = "topologia.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
typeCheckingMode = "standard"

[tool.setuptools.packages.find]
where = ["src"]
include = ["topologia*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
