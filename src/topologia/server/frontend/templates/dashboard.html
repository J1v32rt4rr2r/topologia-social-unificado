<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topología Social - Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, -apple-system, sans-serif; background: #0f0f1a; color: #e0e0e0; }
.header { background: linear-gradient(135deg, #1a1a2e, #16213e); padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a4a; }
.header h1 { color: #e94560; font-size: 1.5em; }
.header .subtitle { color: #888; font-size: 0.9em; }
.container { max-width: 1600px; margin: 0 auto; padding: 20px; }
.grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 20px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
.card { background: #1a1a2e; border-radius: 12px; padding: 20px; border: 1px solid #2a2a4a; }
.card h2 { color: #e94560; font-size: 1em; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
.card h3 { color: #ccc; font-size: 0.9em; margin-bottom: 8px; }
.valor-grande { font-size: 3em; font-weight: bold; }
.valor-grande.rojo { color: #e94560; }
.valor-grande.verde { color: #2ecc71; }
.valor-grande.amarillo { color: #f39c12; }
.metrica { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #2a2a4a; }
.metrica:last-child { border-bottom: none; }
.metrica .label { color: #888; }
.metrica .value { color: #e0e0e0; font-weight: bold; }
.nodo-card { background: #16213e; border-radius: 8px; padding: 12px; border-left: 3px solid #2ecc71; }
.nodo-card.fragil { border-left-color: #e94560; }
.nodo-card h4 { font-size: 0.85em; color: #ccc; margin-bottom: 6px; }
.nodo-card .dims { font-size: 0.8em; color: #888; }
.nodo-card .delta { font-size: 0.8em; }
.toro-container { width: 100%; height: 500px; position: relative; }
#toro-canvas { width: 100%; height: 500px; border-radius: 12px; }
#operaciones-list { list-style: none; }
#operaciones-list li { padding: 8px; margin-bottom: 6px; background: #16213e; border-radius: 6px; font-size: 0.85em; border-left: 3px solid #e94560; }
.alert-box { padding: 12px; margin-bottom: 8px; border-radius: 8px; font-size: 0.9em; }
.alert-box.critical { background: #2d1a1a; border: 1px solid #e94560; color: #e94560; }
.alert-box.warning { background: #2d2d1a; border: 1px solid #f39c12; color: #f39c12; }
.alert-box.info { background: #1a1a2d; border: 1px solid #3498db; color: #3498db; }
.refresh-btn { background: #e94560; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.85em; }
.refresh-btn:hover { background: #d63850; }
@media (max-width: 1024px) { .grid, .grid-3 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>⚡ Topología Social</h1>
    <div class="subtitle" id="subtitle">Cargando...</div>
  </div>
  <button class="refresh-btn" onclick="cargarDatos()">⟳ Actualizar</button>
</div>

<div class="container">
  <div class="grid">
    <div class="card">
      <h2>Diagrama Orbital Cultural</h2>
      <div class="toro-container">
        <canvas id="toro-canvas"></canvas>
      </div>
    </div>
    <div class="card">
      <h2>Estado Global</h2>
      <div id="estado-global">
        <div class="valor-grande rojo" id="delta-valor">--</div>
        <div style="color:#888;font-size:0.9em;">brecha angular δ</div>
        <div style="margin-top:16px;">
          <div class="metrica"><span class="label">M_m (Material)</span><span class="value" id="mm-valor">--</span></div>
          <div class="metrica"><span class="label">M_l (Lógico-valorativa)</span><span class="value" id="ml-valor">--</span></div>
          <div class="metrica"><span class="label">M_s (Social)</span><span class="value" id="ms-valor">--</span></div>
          <div class="metrica"><span class="label">Coherencia</span><span class="value" id="coherencia-valor">--</span></div>
        </div>
      </div>
      <div style="margin-top:16px;">
        <h3>Alertas</h3>
        <div id="alertas-container"></div>
      </div>
      <div id="nodo-info" style="display:none;margin-top:16px;padding-top:16px;border-top:1px solid #2a2a4a;">
        <h3 id="nodo-info-titulo" style="color:#e94560;font-size:1.1em;margin-bottom:8px;"></h3>
        <div id="nodo-info-dims" style="margin-bottom:8px;"></div>
        <div id="nodo-info-just" style="font-size:0.85em;color:#aaa;max-height:200px;overflow-y:auto;"></div>
      </div>
    </div>
  </div>

  <div class="grid-3">
    <div class="card">
      <h2>Evolución δ</h2>
      <canvas id="delta-chart" height="180"></canvas>
    </div>
    <div class="card">
      <h2>Vector M</h2>
      <canvas id="m-chart" height="180"></canvas>
    </div>
    <div class="card">
      <h2>Operaciones Activas</h2>
      <ul id="operaciones-list"></ul>
    </div>
  </div>

  <div class="card">
    <h2>Nodos Culturales</h2>
    <div id="nodos-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;"></div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

let scene, camera, renderer, controls;
let escenaGrupos = [];
let animacionId = null;
let lineaCultura = null;
let trayectorias = [];

function initEscena() {
  const canvas = document.getElementById('toro-canvas');
  const container = canvas.parentElement;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0f0f1a);

  camera = new THREE.PerspectiveCamera(45, container.clientWidth / 500, 0.1, 100);
  camera.position.set(6, 5, 6);

  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setSize(container.clientWidth, 500);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 1.0;

  const luzAmb = new THREE.AmbientLight(0x404060, 0.6);
  scene.add(luzAmb);

  const luzDir = new THREE.DirectionalLight(0xffffff, 1.2);
  luzDir.position.set(5, 10, 7);
  scene.add(luzDir);

  const luzDir2 = new THREE.DirectionalLight(0x4466ff, 0.4);
  luzDir2.position.set(-5, -5, -5);
  scene.add(luzDir2);

  window.addEventListener('resize', () => {
    const w = container.clientWidth;
    renderer.setSize(w, 500);
    camera.aspect = w / 500;
    camera.updateProjectionMatrix();
  });

  // Ejes rotulados
  scene.add(new THREE.AxesHelper(5));
}

function limpiarEscena() {
  escenaGrupos.forEach(g => scene.remove(g));
  escenaGrupos = [];
  trayectorias.forEach(t => scene.remove(t));
  trayectorias = [];
  if (lineaCultura) { scene.remove(lineaCultura); lineaCultura = null; }
}

// Funciones orbitales del lado del cliente
function thetaNodo(M_l) {
  return 360 / Math.max(M_l, 0.1);
}

function thetaCultura(promedioMl) {
  if (!promedioMl || promedioMl <= 0) return 0;
  return 360 / promedioMl;
}

function posicionOrbital(thetaN, thetaC, z, M_s) {
  const radio = 2.5;
  const angX = (thetaN / 360) * Math.PI * 2;
  const angY = (thetaN / 360) * Math.PI * 2;
  const x = radio * Math.sin(angX);
  const y = radio * Math.cos(angY) * 0.8 + 0.5;
  const zPos = z * 1.0;
  const grosor = 0.02 + (M_s / 9.9) * 0.15;
  return { x, y, z: zPos, grosor };
}

function dibujarOrbital(data) {
  limpiarEscena();

  const nodos = data.nodos || [];
  const historial = data.historial || [];
  const tiempoActual = historial.length - 1;

  // Calcular promedios actuales
  const mlProm = nodos.reduce((s, n) => s + n.l, 0) / (nodos.length || 1);
  const tc = thetaCultura(mlProm);

  // Plano de referencia (θ_cultura como línea Y)
  const geomLinea = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, tc / 90, -1),
    new THREE.Vector3(0, tc / 90, nodos.length + 2),
  ]);
  lineaCultura = new THREE.Line(geomLinea, new THREE.LineBasicMaterial({
    color: 0x4466aa, transparent: true, opacity: 0.2, dashSize: 0.1, gapSize: 0.1,
  }));
  scene.add(lineaCultura);

  // Etiqueta θ_cultura
  const lblCanvas = document.createElement('canvas');
  lblCanvas.width = 256; lblCanvas.height = 48;
  const lblCtx = lblCanvas.getContext('2d');
  lblCtx.fillStyle = 'rgba(68,102,170,0.7)';
  lblCtx.font = '16px system-ui';
  lblCtx.fillText(`θ_cultura = ${tc.toFixed(1)}°`, 8, 28);
  const lblTex = new THREE.CanvasTexture(lblCanvas);
  const lblMat = new THREE.SpriteMaterial({ map: lblTex, transparent: true });
  const lblSprite = new THREE.Sprite(lblMat);
  lblSprite.position.set(-0.5, tc / 90 + 0.3, -0.8);
  lblSprite.scale.set(1.8, 0.3, 1);
  scene.add(lblSprite);
  escenaGrupos.push(lblSprite);

  // Nodos actuales (z = tiempoActual)
  nodos.forEach(n => {
    const tn = thetaNodo(n.l);
    const pos = posicionOrbital(tn, tc, tiempoActual, n.s);
    const grupo = new THREE.Group();
    const radio = n.fragil ? 0.22 : 0.16;

    // Color basado en arrastre gravimétrico (M_m * M_s * delta_theta)
    const deltaTheta = Math.abs(tn - tc);
    const arrastre = n.m * n.s * (deltaTheta / 360);
    const hue = 0.55 - Math.min(arrastre, 1) * 0.4;
    const color = new THREE.Color().setHSL(hue, 0.9, 0.5);

    const esfera = new THREE.Mesh(
      new THREE.SphereGeometry(radio, 16, 16),
      new THREE.MeshPhongMaterial({
        color: color,
        emissive: color,
        emissiveIntensity: 0.2 + (n.m / 9.9) * 0.4,
      })
    );
    esfera.position.set(pos.x, pos.y, pos.z);
    esfera.userData = { nodoId: n.id };
    grupo.add(esfera);

    // Halo gravitacional (M_m como peso visual)
    const halo = new THREE.Mesh(
      new THREE.SphereGeometry(radio * (1 + n.m / 20), 16, 16),
      new THREE.MeshBasicMaterial({
        color: color,
        transparent: true,
        opacity: 0.08 + (n.m / 9.9) * 0.15,
      })
    );
    halo.position.set(pos.x, pos.y, pos.z);
    grupo.add(halo);

    // Anillo frágil
    if (n.fragil) {
      const anillo = new THREE.Mesh(
        new THREE.RingGeometry(radio * 1.6, radio * 2.2, 24),
        new THREE.MeshBasicMaterial({
          color: 0xe94560, transparent: true, opacity: 0.6, side: THREE.DoubleSide,
        })
      );
      anillo.position.set(pos.x, pos.y, pos.z);
      anillo.lookAt(0, 0, 0);
      grupo.add(anillo);
    }

    // Etiqueta
    const elCanvas = document.createElement('canvas');
    elCanvas.width = 256; elCanvas.height = 64;
    const ctx = elCanvas.getContext('2d');
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.roundRect(0, 0, 256, 64, 8); ctx.fill();
    ctx.fillStyle = n.fragil ? '#e94560' : '#ffffff';
    ctx.font = 'bold 22px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(`${n.id}  δ=${n.delta.toFixed(0)}°`, 128, 40);
    const tex = new THREE.CanvasTexture(elCanvas);
    const sMat = new THREE.SpriteMaterial({ map: tex, transparent: true });
    const sprite = new THREE.Sprite(sMat);
    sprite.position.set(pos.x, pos.y - 0.4, pos.z);
    sprite.scale.set(1.4, 0.35, 1);
    grupo.add(sprite);

    scene.add(grupo);
    escenaGrupos.push(grupo);
  });

  // Cintas orbitales (trayectoria histórica en Z)
  if (historial.length >= 2) {
    const nodosIds = [...new Set(nodos.map(n => n.id))];
    nodosIds.forEach(id => {
      const puntos = [];
      const grosorPuntos = [];
      historial.forEach((h, zi) => {
        const hn = (h.nodos || []).find(nx => nx.id === id);
        if (hn) {
          const tn = thetaNodo(hn.l);
          const pos = posicionOrbital(tn, tc, zi, hn.s);
          puntos.push(new THREE.Vector3(pos.x, pos.y, pos.z));
          grosorPuntos.push(pos.grosor);
        }
      });
      if (puntos.length < 2) return;

      // Cinta como tubo de grosor variable
      const curva = new THREE.CatmullRomCurve3(puntos);
      const tubeGeo = new THREE.TubeGeometry(curva, puntos.length * 4, 0.04, 6, false);
      const col = new THREE.Color().setHSL(0.55, 0.8, 0.4);
      const tubeMat = new THREE.MeshPhongMaterial({
        color: col, emissive: col, emissiveIntensity: 0.15,
        transparent: true, opacity: 0.4, side: THREE.DoubleSide,
      });
      const tube = new THREE.Mesh(tubeGeo, tubeMat);
      scene.add(tube);
      trayectorias.push(tube);
    });
  }

  // Grid horizontal de referencia
  const gridHelper = new THREE.GridHelper(6, 10, 0x4466aa, 0x2a2a4a);
  gridHelper.position.y = -0.5;
  scene.add(gridHelper);
  escenaGrupos.push(gridHelper);
}

function animar() {
  controls.update();
  renderer.render(scene, camera);
  animacionId = requestAnimationFrame(animar);
}

// Canvas roundRect polyfill
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    this.moveTo(x + r, y);
    this.lineTo(x + w - r, y);
    this.quadraticCurveTo(x + w, y, x + w, y + r);
    this.lineTo(x + w, y + h - r);
    this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    this.lineTo(x + r, y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - r);
    this.lineTo(x, y + r);
    this.quadraticCurveTo(x, y, x + r, y);
  };
}

initEscena();
animar();

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
renderer.domElement.addEventListener('click', (event) => {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const meshes = [];
  scene.traverse((child) => {
    if (child.isMesh && child.geometry && child.geometry.type === 'SphereGeometry') meshes.push(child);
  });
  const intersects = raycaster.intersectObjects(meshes);
  if (intersects.length > 0) {
    const hit = intersects[0].object;
    if (hit.userData && hit.userData.nodoId) {
      window.mostrarInfoNodo(hit.userData.nodoId);
    }
  }
});

let nodosDataGlobal = [];

window.mostrarInfoNodo = function(nodoId) {
  const n = nodosDataGlobal.find(x => x.id === nodoId);
  if (!n) return;
  const el = document.getElementById('nodo-info');
  el.style.display = 'block';
  document.getElementById('nodo-info-titulo').textContent = `${n.id} ${n.fragil ? '⚠ FRAGIL' : ''}`;
  document.getElementById('nodo-info-dims').innerHTML =
    `M_m: ${n.m.toFixed(1)} (${n.tend_m}) | M_l: ${n.l.toFixed(1)} (${n.tend_l}) | M_s: ${n.s.toFixed(1)} (${n.tend_s}) | δ = ${n.delta.toFixed(1)}°`;
  let justHtml = '';
  if (n.just_m) justHtml += `<p><strong>M_m:</strong> ${n.just_m}</p>`;
  if (n.just_l) justHtml += `<p><strong>M_l:</strong> ${n.just_l}</p>`;
  if (n.just_s) justHtml += `<p><strong>M_s:</strong> ${n.just_s}</p>`;
  document.getElementById('nodo-info-just').innerHTML = justHtml;
};

window.actualizarToro = function(data) {
  nodosDataGlobal = (data && data.nodos) || [];
  dibujarOrbital(data || { nodos: [], historial: [] });
};
</script>

<script>
let deltaChart = null;
let mChart = null;

async function cargarDatos() {
  try {
    const res = await fetch('/api/dashboard/data');
    const data = await res.json();

    if (data.error) { document.getElementById('subtitle').textContent = data.error; return; }

    document.getElementById('subtitle').textContent = `${data.sociedad} · ${new Date(data.fecha).toLocaleString('es-CL')}`;

    const delta = data.delta_promedio;
    const elDelta = document.getElementById('delta-valor');
    elDelta.textContent = `${delta.toFixed(1)}°`;
    elDelta.className = 'valor-grande ' + (delta >= 45 ? 'rojo' : delta >= 35 ? 'amarillo' : 'verde');

    document.getElementById('mm-valor').textContent = data.M_m.toFixed(1);
    document.getElementById('ml-valor').textContent = data.M_l.toFixed(1);
    document.getElementById('ms-valor').textContent = data.M_s.toFixed(1);
    document.getElementById('coherencia-valor').textContent = data.coherente ? 'Sí' : 'NO';

    // Toro
    if (window.actualizarToro) window.actualizarToro(data);

    // Alertas
    const alertasEl = document.getElementById('alertas-container');
    alertasEl.innerHTML = '';
    const alerts = [];
    if (data.delta_promedio >= 45) alerts.push({ tipo: 'critical', msg: `δ = ${data.delta_promedio.toFixed(1)}° — Umbral de reconfiguración` });
    if (data.historial.length >= 2) {
      const diff = Math.abs(data.historial[data.historial.length-1].delta - data.historial[data.historial.length-2].delta);
      if (diff >= 5) alerts.push({ tipo: 'warning', msg: `Δδ = ${diff.toFixed(1)}° en 24h — Cambio acelerado` });
    }
    data.nodos.filter(n => n.fragil).forEach(n => alerts.push({ tipo: 'warning', msg: `Nodo frágil: ${n.id} (δ = ${n.delta.toFixed(1)}°)` }));
    if (alerts.length === 0) alertasEl.innerHTML = '<div style="color:#2ecc71;font-size:0.9em;">✓ Sin alertas activas</div>';
    alerts.forEach(a => {
      const d = document.createElement('div');
      d.className = `alert-box ${a.tipo}`;
      d.textContent = a.msg;
      alertasEl.appendChild(d);
    });

    // Nodos
    const nodosGrid = document.getElementById('nodos-grid');
    nodosGrid.innerHTML = '';
    data.nodos.forEach(n => {
      const card = document.createElement('div');
      card.className = `nodo-card${n.fragil ? ' fragil' : ''}`;
      card.innerHTML = `<h4>${n.id}</h4>
        <div class="dims">M_m: ${n.m.toFixed(1)} · M_l: ${n.l.toFixed(1)} · M_s: ${n.s.toFixed(1)}</div>
        <div class="delta" style="color:${n.fragil ? '#e94560' : '#888'}">δ = ${n.delta.toFixed(1)}°</div>`;
      nodosGrid.appendChild(card);
    });

    // Operaciones
    const opsList = document.getElementById('operaciones-list');
    opsList.innerHTML = '';
    if (data.operaciones.length === 0) opsList.innerHTML = '<li style="color:#888;">Ninguna operación activa</li>';
    data.operaciones.forEach(o => {
      const li = document.createElement('li');
      li.innerHTML = `<strong>${o.codigo}</strong> ${o.nombre} <span style="float:right;color:${o.intensidad > 0.5 ? '#e94560' : '#888'};font-size:0.85em;">${(o.intensidad*100).toFixed(0)}%</span><br><span style="font-size:0.8em;color:#888;">${o.descripcion}</span>`;
      opsList.appendChild(li);
    });

    // Charts
    const fechas = data.historial.map(h => h.fecha.slice(5));
    const deltas = data.historial.map(h => h.delta);

    if (deltaChart) deltaChart.destroy();
    deltaChart = new Chart(document.getElementById('delta-chart'), {
      type: 'line',
      data: {
        labels: fechas,
        datasets: [{
          label: 'δ',
          data: deltas,
          borderColor: '#e94560',
          backgroundColor: 'rgba(233,69,96,0.1)',
          fill: true,
          tension: 0.3,
          pointRadius: 3,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#888', font: { size: 10 } }, grid: { color: '#2a2a4a' } },
          y: { ticks: { color: '#888', font: { size: 10 } }, grid: { color: '#2a2a4a' } }
        }
      }
    });

    if (mChart) mChart.destroy();
    mChart = new Chart(document.getElementById('m-chart'), {
      type: 'line',
      data: {
        labels: fechas,
        datasets: [
          { label: 'M_m', data: data.historial.map(h => h.M_m), borderColor: '#3498db', tension: 0.3, pointRadius: 2 },
          { label: 'M_l', data: data.historial.map(h => h.M_l), borderColor: '#2ecc71', tension: 0.3, pointRadius: 2 },
          { label: 'M_s', data: data.historial.map(h => h.M_s), borderColor: '#f39c12', tension: 0.3, pointRadius: 2 },
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#888', font: { size: 10 } } } },
        scales: {
          x: { ticks: { color: '#888', font: { size: 10 } }, grid: { color: '#2a2a4a' } },
          y: { ticks: { color: '#888', font: { size: 10 } }, grid: { color: '#2a2a4a' } }
        }
      }
    });

  } catch (e) {
    console.error('Error cargando datos:', e);
    document.getElementById('subtitle').textContent = 'Error al cargar datos';
  }
}

cargarDatos();
setInterval(cargarDatos, 60000);
</script>
</body>
</html>
